    app: orderservice
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: orderservice
  template:
    metadata:
      labels:
        app: orderservice
    spec:
      initContainers:
      - name: wait-for-postgres
        image: busybox:1.35
        command: ['sh', '-c', 'until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done;']
      - name: wait-for-axon
        image: busybox:1.35
        command: ['sh', '-c', 'until nc -z axonserver 8124; do echo waiting for axonserver; sleep 2; done;']
      - name: wait-for-discovery
        image: busybox:1.35
        command: ['sh', '-c', 'until nc -z discoveryserver 8761; do echo waiting for discoveryserver; sleep 2; done;']
      containers:
      - name: orderservice
        image: project3-orderservice:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8001
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "production"
        - name: PORT
          value: "8001"
        - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
          value: "http://discoveryserver:8761/eureka/"
        - name: EUREKA_INSTANCE_HOSTNAME
          value: "orderservice"
        - name: EUREKA_INSTANCE_LEASERENEWALINTERVALINSECONDS
          value: "10"
        - name: EUREKA_INSTANCE_LEASEEXPIRATIONDURATIONINSECONDS
          value: "30"
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:postgresql://postgres:5432/OrderService"
        - name: SPRING_DATASOURCE_USERNAME
          value: "postgres"
        - name: SPRING_DATASOURCE_PASSWORD
          value: "postgre"
        - name: AXON_AXONSERVER_SERVERS
          value: "axonserver:8124"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "250m"
        startupProbe:
          tcpSocket:
            port: 8001
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 40
        livenessProbe:
          tcpSocket:
            port: 8001
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          tcpSocket:
            port: 8001
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notificationservice
  labels:
    app: notificationservice
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: notificationservice
  template:
    metadata:
      labels:
        app: notificationservice
    spec:
      initContainers:
      - name: wait-for-kafka
        image: busybox:1.35
        command: ['sh', '-c', 'echo "Waiting for Kafka to be ready..."; timeout=300; elapsed=0; while ! nc -z kafka 9092; do if [ $elapsed -ge $timeout ]; then echo "Timeout waiting for Kafka after ${timeout}s, continuing anyway..."; break; fi; echo "Kafka not ready yet, waiting... (${elapsed}s)"; sleep 5; elapsed=$((elapsed+5)); done; if nc -z kafka 9092; then echo "Kafka is ready!"; sleep 5; else echo "Kafka not available, but continuing..."; fi']
      - name: wait-for-discovery
        image: busybox:1.35
        command: ['sh', '-c', 'echo "Waiting for Discovery Server to be ready..."; until nc -z discoveryserver 8761; do echo "Discovery Server not ready yet, waiting..."; sleep 5; done; echo "Discovery Server is ready!";']
      containers:
      - name: notificationservice
        image: project3-notificationservice:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8004
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "production"
        - name: PORT
          value: "8004"
        - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
          value: "http://discoveryserver:8761/eureka/"
        - name: EUREKA_INSTANCE_HOSTNAME
          value: "notificationservice"
        - name: EUREKA_INSTANCE_LEASERENEWALINTERVALINSECONDS
          value: "10"
        - name: EUREKA_INSTANCE_LEASEEXPIRATIONDURATIONINSECONDS
          value: "30"
        - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
          value: "kafka:9092"
        - name: SPRING_KAFKA_CONSUMER_GROUP_ID
          value: "notificationservice-group"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "250m"
        startupProbe:
          tcpSocket:
            port: 8004
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 40
        livenessProbe:
          tcpSocket:
            port: 8004
          initialDelaySeconds: 90
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          tcpSocket:
            port: 8004
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

