# Keycloak Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  labels:
    app: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      initContainers:
      - name: wait-for-postgres
        image: busybox:1.35
        command: ['sh', '-c', 'echo "Waiting for PostgreSQL to be ready..."; until nc -z postgres 5432; do echo "PostgreSQL not ready yet, waiting..."; sleep 5; done; echo "PostgreSQL is ready!"; sleep 5;']
      - name: import-gmail-cert
        image: alpine:latest
        command: ['sh', '-c', 'echo "Importing Gmail SSL certificate..."; apk add --no-cache openssl openjdk17-jre && echo | openssl s_client -connect smtp.gmail.com:587 -starttls smtp -showcerts 2>/dev/null | openssl x509 -outform PEM > /certs/gmail.pem && keytool -importcert -trustcacerts -file /certs/gmail.pem -alias gmail -keystore /certs/cacerts -storepass changeit -noprompt && cp /certs/cacerts /opt/keycloak/conf/cacerts && echo "Gmail certificate imported successfully" || echo "Failed to import certificate, continuing anyway..."']
        volumeMounts:
        - name: certs-volume
          mountPath: /certs
        - name: keycloak-conf
          mountPath: /opt/keycloak/conf
      containers:
      - name: keycloak
        # Use custom image with theme: project3-keycloak:26.4.2-theme
        # To build: cd Keycloak && ./build-keycloak-image.sh (or .ps1 on Windows)
        # Then: minikube image load project3-keycloak:26.4.2-theme
        image: quay.io/keycloak/keycloak:26.4.2
        imagePullPolicy: IfNotPresent
        args:
          - start-dev
          - --db=postgres
          - --db-url-host=postgres
          - --db-url-port=5432
          - --db-url-database=keycloak
          - --db-username=postgres
          - --db-password=postgre
        ports:
        - containerPort: 8180
        volumeMounts:
        - name: keycloak-conf
          mountPath: /opt/keycloak/conf
        env:
        - name: KC_BOOTSTRAP_ADMIN_USERNAME
          value: "admin"
        - name: KC_BOOTSTRAP_ADMIN_PASSWORD
          value: "admin"
        - name: KC_HTTP_PORT
          value: "8180"
        - name: KC_DB
          value: "postgres"
        - name: KC_DB_USERNAME
          value: "postgres"
        - name: KC_DB_PASSWORD
          value: "postgre"
        - name: KC_DB_URL_DATABASE
          value: "keycloak"
        - name: KC_DB_URL_HOST
          value: "postgres"
        - name: KC_DB_URL_PORT
          value: "5432"
        - name: KC_MAIL_HOST
          value: "smtp.gmail.com"
        - name: KC_MAIL_PORT
          value: "587"
        - name: KC_MAIL_FROM
          value: "dodinhtrungthptyv@gmail.com"
        - name: KC_MAIL_AUTH
          value: "true"
        - name: KC_MAIL_USER
          value: "dodinhtrungthptyv@gmail.com"
        - name: KC_MAIL_PASSWORD
          value: "rbgx isuc fdjc syyp"
        - name: KC_MAIL_STARTTLS
          value: "true"
        - name: KC_MAIL_SSL
          value: "false"
        - name: JAVA_OPTS_APPEND
          value: "-Djavax.net.ssl.trustStore=/opt/keycloak/conf/cacerts -Djavax.net.ssl.trustStorePassword=changeit"
        resources:
          requests:
            memory: "384Mi"
            cpu: "200m"
          limits:
            memory: "768Mi"
            cpu: "400m"
        startupProbe:
          tcpSocket:
            port: 8180
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 60
        livenessProbe:
          tcpSocket:
            port: 8180
          initialDelaySeconds: 300
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          tcpSocket:
            port: 8180
          initialDelaySeconds: 180
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
      volumes:
      - name: certs-volume
        emptyDir: {}
      - name: keycloak-conf
        emptyDir: {}
      # Note: To use custom theme, build custom image with:
      #   cd Keycloak && ./build-keycloak-image.sh
      #   minikube image load project3-keycloak:26.4.2-theme
      # Then update image above to: project3-keycloak:26.4.2-theme

---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  labels:
    app: keycloak
spec:
  type: LoadBalancer
  selector:
    app: keycloak
  ports:
    - protocol: TCP
      port: 8180
      targetPort: 8180
      name: http

